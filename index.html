<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0;" name="viewport" />
    <title>h5</title>
    <link type="text/css" rel="stylesheet" href="./css/loading.css">
    <style>
      .full-screen {
        width: 100%;
        height: 100%;
        position: absolute;
        left: 0;
        top: 0;
      }

      .mask {
        background-color: rgba(0, 0, 0, .2);
      }

      .oh {
        overflow: hidden;
      }


      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }


      body {
        font-size: 14px;
        position: relative;
        max-width: 640px;
        /* height: 100vh; */
        overflow: hidden;
        display: block;
        margin-left: auto;
        margin-right: auto;
        background-image: linear-gradient(to top, #a18cd1 0%, #fbc2eb 100%);
        margin: auto;
      }

      .flex-container {
        width: 100%;
        height: 100%;
        position: absolute;
        display: -webkit-box;
        display: -ms-flexbox;
        display: flex;
        -ms-flex-wrap: wrap;
            flex-wrap: wrap;
        -webkit-box-pack: center;
            -ms-flex-pack: center;
                justify-content: center;
        -webkit-box-align: center;
            -ms-flex-align: center;
                align-items: center;
      }
      .unit {
        text-align: center;
      }
      .unit p {
        margin-top: 100px;
        font-family: 'Lato', sans-serif;
        font-weight: 100;
        text-transform: uppercase;
        color: #fff;
      }
      .heart {
        position: relative;
        font-size: 0;
        width: 138px;
      }
      [class*="heart-piece-"] {
        position: absolute;
        top: -5px;
        width: 10px;
        height: 10px;
        border-radius: 5px;
      }
      .heart-piece-4 {
        -webkit-animation: piece-4 3.2s infinite;
                animation: piece-4 3.2s infinite;
      }
      .heart-piece-3,
      .heart-piece-5 {
        -webkit-animation: piece-3 3.2s infinite;
                animation: piece-3 3.2s infinite;
      }
      .heart-piece-2,
      .heart-piece-6 {
        -webkit-animation: piece-2 3.2s infinite;
                animation: piece-2 3.2s infinite;
      }
      .heart-piece-1,
      .heart-piece-7 {
        -webkit-animation: piece-1 3.2s infinite;
                animation: piece-1 3.2s infinite;
      }
      .heart-piece-0,
      .heart-piece-8 {
        -webkit-animation: piece-0 3.2s infinite;
                animation: piece-0 3.2s infinite;
      }
      .heart-piece-0 {
        left: 0px;
        -webkit-animation-delay: 0s;
                animation-delay: 0s;
        background-color: #ec2d73;
      }
      .heart-piece-1 {
        left: 16px;
        -webkit-animation-delay: 0.15s;
                animation-delay: 0.15s;
        background-color: #eb5324;
      }
      .heart-piece-2 {
        left: 32px;
        -webkit-animation-delay: 0.3s;
                animation-delay: 0.3s;
        background-color: #fdc800;
      }
      .heart-piece-3 {
        left: 48px;
        -webkit-animation-delay: 0.45s;
                animation-delay: 0.45s;
        background-color: #47b264;
      }
      .heart-piece-4 {
        left: 64px;
        -webkit-animation-delay: 0.6s;
                animation-delay: 0.6s;
        background-color: #1470bd;
      }
      .heart-piece-5 {
        left: 80px;
        -webkit-animation-delay: 0.75s;
                animation-delay: 0.75s;
        background-color: #76469a;
      }
      .heart-piece-6 {
        left: 96px;
        -webkit-animation-delay: 0.9s;
                animation-delay: 0.9s;
        background-color: #ec2d73;
      }
      .heart-piece-7 {
        left: 112px;
        -webkit-animation-delay: 1.05s;
                animation-delay: 1.05s;
        background-color: #eb5324;
      }
      .heart-piece-8 {
        left: 128px;
        -webkit-animation-delay: 1.2s;
                animation-delay: 1.2s;
        background-color: #fdc800;
      }
      @-webkit-keyframes piece-4 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 94px;
          top: -23px;
        }
      }
      @keyframes piece-4 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 94px;
          top: -23px;
        }
      }
      @-webkit-keyframes piece-3 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 90px;
          top: -31px;
        }
      }
      @keyframes piece-3 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 90px;
          top: -31px;
        }
      }
      @-webkit-keyframes piece-2 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 80px;
          top: -37px;
        }
      }
      @keyframes piece-2 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 80px;
          top: -37px;
        }
      }
      @-webkit-keyframes piece-1 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 60px;
          top: -31px;
        }
      }
      @keyframes piece-1 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 60px;
          top: -31px;
        }
      }
      @-webkit-keyframes piece-0 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 30px;
          top: -15px;
        }
      }
      @keyframes piece-0 {
        0%, 10%, 90%, 100% {
          height: 10px;
          top: -5px;
        }
        45%, 55% {
          height: 30px;
          top: -15px;
        }
      }

    </style>
    <link rel="stylesheet" href="//3.swiper.com.cn/dist/css/swiper.min.css">
    <script src="//cdn.jsdelivr.net/npm/zepto@1.2.0/dist/zepto.min.js"></script>
    <script src="//raw.githack.com/madrobby/zepto/master/src/fx.js"></script>
    <script src="//3.swiper.com.cn/dist/js/swiper.min.js"></script>
    <script src="//res.wx.qq.com/open/js/jweixin-1.0.0.js"></script>

    <script src="//webapi.amap.com/maps?v=1.3&key=169d2dd7829fe45690fabec812d05bc3"></script>
  </head>
  <body>
    <div id="app">
      <div class="flex-container">
        <div class="unit">
          <div class="heart">
            <div class="heart-piece-0"></div>
            <div class="heart-piece-1"></div>
            <div class="heart-piece-2"></div>
            <div class="heart-piece-3"></div>
            <div class="heart-piece-4"></div>
            <div class="heart-piece-5"></div>
            <div class="heart-piece-6"></div>
            <div class="heart-piece-7"></div>
            <div class="heart-piece-8"></div>
          </div>
          <p>加载中...</p>
        </div>
      </div>
    </div>

</html>
